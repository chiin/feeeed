<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcard Reviewer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #8e8e93;
        }

        .progress {
            font-size: 0.9rem;
            color: #0a84ff;
            font-weight: 600;
            background: #2c2c2e;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .card {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            min-height: 320px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
        }

        .card-content {
            width: 100%;
            margin: auto 0;
        }

        .prompt-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .card-img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .audio-btn {
            background: #3a3a3c;
            color: #0a84ff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .answer-box {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #48484a;
        }

        .answer-text {
            font-size: 1.3rem;
            color: #30d158;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .notes-text {
            font-size: 0.95rem;
            color: #8e8e93;
            font-style: italic;
        }

        .action-area {
            width: 100%;
            max-width: 480px;
            margin-top: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary { background: #0a84ff; color: #fff; }

        .btn-grid {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn-again { background: #ff453a; color: #fff; }
        .btn-hard { background: #ff9f0a; color: #000; }
        .btn-good { background: #30d158; color: #000; }
        .btn-easy { background: #64d2ff; color: #000; }

        .btn-grade {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 4px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .interval-label {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 2px;
            font-weight: 500;
        }

        .screen { display: none; width: 100%; max-width: 480px; text-align: center; }
        .screen.active { display: block; }

        .loader {
            border: 3px solid #3a3a3c;
            border-top: 3px solid #0a84ff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loadingScreen" class="screen active">
        <div class="loader"></div>
        <p style="color: #8e8e93;">Loading deck session...</p>
    </div>

    <!-- MAIN REVIEW SCREEN -->
    <div id="reviewScreen" class="screen">
        <div class="header">
            <div id="deckTitle" class="title">Deck</div>
            <div id="progress" class="progress">0 / 0</div>
        </div>

        <div class="card">
            <div class="card-content">
                <div id="frontText" class="prompt-text"></div>
                <img id="frontImage" class="card-img" style="display:none;" />
                <button id="frontAudioBtn" class="audio-btn" style="display:none;" onclick="playAudio('frontAudio')">🔊 Play Audio</button>

                <div id="answerBox" class="answer-box">
                    <div id="backText" class="answer-text"></div>
                    <img id="backImage" class="card-img" style="display:none;" />
                    <button id="backAudioBtn" class="audio-btn" style="display:none;" onclick="playAudio('backAudio')">🔊 Play Audio</button>
                    <div id="backNotes" class="notes-text"></div>
                </div>
            </div>
        </div>

        <div class="action-area">
            <button id="showBtn" class="btn btn-primary" onclick="showAnswer()">Show Answer</button>
            <div id="gradeGrid" class="btn-grid">
                <button class="btn-grade btn-again" onclick="gradeCard(1)">
                    Again
                    <span id="int-1" class="interval-label">1d</span>
                </button>
                <button class="btn-grade btn-hard" onclick="gradeCard(2)">
                    Hard
                    <span id="int-2" class="interval-label">1d</span>
                </button>
                <button class="btn-grade btn-good" onclick="gradeCard(3)">
                    Good
                    <span id="int-3" class="interval-label">1d</span>
                </button>
                <button class="btn-grade btn-easy" onclick="gradeCard(4)">
                    Easy
                    <span id="int-4" class="interval-label">1d</span>
                </button>
            </div>
        </div>
    </div>

    <!-- FINISH SCREEN -->
    <div id="finishScreen" class="screen">
        <h2 style="color: #30d158; font-size: 2rem; margin-bottom: 8px;">🎉 Session Complete!</h2>
        <p style="color: #8e8e93; margin-bottom: 24px;">All due cards reviewed.</p>
        <button id="syncBtn" class="btn btn-primary" onclick="syncWithGitHub()">Sync Results to GitHub</button>
        <p id="syncStatus" style="margin-top: 16px; color: #8e8e93; font-size: 0.9rem;"></p>
    </div>

    <audio id="frontAudio"></audio>
    <audio id="backAudio"></audio>

    <script>
        let deckId = "";
        let cards = [];
        let currentIndex = 0;
        let sessionResults = [];

        // Parse query parameter ?deck=
        const urlParams = new URLSearchParams(window.location.search);
        deckId = urlParams.get('deck');

        if (!deckId) {
            loadDeckMenu();
        } else {
            loadDeck();
        }
        
        async function loadDeckMenu() {
            try {
                const res = await fetch("config.json");
                const config = await res.json();
                const loading = document.getElementById('loadingScreen');
                
                let html = `<h2>Available Decks</h2><div style="display:flex; flex-direction:column; gap:12px; margin-top:20px;">`;
                for (const [key, stream] of Object.entries(config.streams || {})) {
                    if (stream.type === "anki_deck") {
                        html += `<a href="reviewer.html?deck=${key}" class="btn btn-primary" style="text-decoration:none;">${stream.feed_title || key}</a>`;
                    }
                }
                html += `</div>`;
                loading.innerHTML = html;
            } catch (err) {
                document.getElementById('loadingScreen').innerHTML = "<p style='color:#ff453a;'>No deck specified in URL.</p>";
            }
        }

        async function loadDeck() {
            try {
                const res = await fetch(`cards/${deckId}_deck.json`);
                if (!res.ok) throw new Error("Deck file not found");
                const data = await res.json();
                
                document.getElementById('deckTitle').innerText = data.title || deckId;
                cards = data.cards || [];

                if (cards.length === 0) {
                    showScreen('finishScreen');
                    document.getElementById('finishScreen').innerHTML = "<h2>🎉 All Caught Up!</h2><p style='color:#8e8e93;'>No cards due today.</p>";
                    return;
                }

                showScreen('reviewScreen');
                renderCard();
            } catch (err) {
                document.getElementById('loadingScreen').innerHTML = `<p style='color:#ff453a;'>Error loading deck: ${err.message}</p>`;
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function renderCard() {
            const card = cards[currentIndex];
            document.getElementById('progress').innerText = `${currentIndex + 1} / ${cards.length}`;

            // Reset UI State
            document.getElementById('answerBox').style.display = 'none';
            document.getElementById('showBtn').style.display = 'block';
            document.getElementById('gradeGrid').style.display = 'none';

            // Render Front
            document.getElementById('frontText').innerText = card.front.text || '';
            
            const frontImg = document.getElementById('frontImage');
            if (card.front.image) {
                frontImg.src = card.front.image;
                frontImg.style.display = 'block';
            } else {
                frontImg.style.display = 'none';
            }

            const frontAudioBtn = document.getElementById('frontAudioBtn');
            if (card.front.audio) {
                document.getElementById('frontAudio').src = card.front.audio;
                frontAudioBtn.style.display = 'inline-block';
                playAudio('frontAudio');
            } else {
                frontAudioBtn.style.display = 'none';
            }

            // Prepare Back Content
            document.getElementById('backText').innerText = card.back.text || '';
            document.getElementById('backNotes').innerText = card.back.notes || '';
            
            const backImg = document.getElementById('backImage');
            if (card.back.image) {
                backImg.src = card.back.image;
                backImg.style.display = 'block';
            } else {
                backImg.style.display = 'none';
            }

            if (card.back.audio) {
                document.getElementById('backAudio').src = card.back.audio;
                document.getElementById('backAudioBtn').style.display = 'inline-block';
            } else {
                document.getElementById('backAudioBtn').style.display = 'none';
            }

            calculateIntervalLabels(card.sm2 || {});
        }

        function showAnswer() {
            document.getElementById('answerBox').style.display = 'block';
            document.getElementById('showBtn').style.display = 'none';
            document.getElementById('gradeGrid').style.display = 'grid';

            const card = cards[currentIndex];
            if (card.back.audio) {
                playAudio('backAudio');
            }
        }

        function playAudio(elementId) {
            const audio = document.getElementById(elementId);
            if (audio && audio.src) {
                audio.play().catch(() => {});
            }
        }

        // Anki SM-2 Algorithm Calculation
        function computeSM2(currentSm2, grade) {
            let ef = currentSm2.easiness_factor || 2.5;
            let interval = currentSm2.interval || 0;
            let reps = currentSm2.repetitions || 0;
            let state = currentSm2.state || 'new';

            if (grade === 1) { // Again
                reps = 0;
                interval = 1;
                ef = Math.max(1.3, ef - 0.2);
                state = 'relearning';
            } else if (grade === 2) { // Hard
                interval = reps === 0 ? 1 : Math.max(interval + 1, Math.round(interval * 1.2));
                ef = Math.max(1.3, ef - 0.15);
                state = 'review';
            } else if (grade === 3) { // Good
                if (reps === 0) interval = 1;
                else if (reps === 1) interval = 6;
                else interval = Math.round(interval * ef);
                reps += 1;
                state = 'review';
            } else if (grade === 4) { // Easy
                if (reps === 0) interval = 4;
                else if (reps === 1) interval = 8;
                else interval = Math.round(interval * ef * 1.3);
                reps += 1;
                ef += 0.15;
                state = 'review';
            }

            const nextDue = new Date(Date.now() + interval * 86400000).toISOString();

            return {
                easiness_factor: parseFloat(ef.toFixed(2)),
                interval: interval,
                repetitions: reps,
                state: state,
                next_due: nextDue
            };
        }

        function calculateIntervalLabels(sm2) {
            [1, 2, 3, 4].forEach(grade => {
                const res = computeSM2(sm2, grade);
                document.getElementById(`int-${grade}`).innerText = `${res.interval}d`;
            });
        }

        function gradeCard(grade) {
            const card = cards[currentIndex];
            const updatedSm2 = computeSM2(card.sm2 || {}, grade);

            sessionResults.push({
                id: card.id,
                ...updatedSm2
            });

            currentIndex++;
            if (currentIndex < cards.length) {
                renderCard();
            } else {
                showScreen('finishScreen');
                syncWithGitHub();
            }
        }

        function getPAT() {
            let token = localStorage.getItem("feeeed_pat");
            if (!token) {
                token = prompt("Enter your GitHub PAT (saved on your device):");
                if (token) {
                    token = token.trim();
                    localStorage.setItem("feeeed_pat", token);
                }
            }
            return token;
        }

        async function syncWithGitHub() {
            const btn = document.getElementById('syncBtn');
            const status = document.getElementById('syncStatus');

            btn.disabled = true;
            btn.innerText = "Syncing...";
            status.innerText = "Sending session data to GitHub Actions...";

            const token = getPAT();
            if (!token) {
                status.innerText = "PAT required to sync.";
                btn.disabled = false;
                btn.innerText = "Try Syncing Again";
                return;
            }

            try {
                const res = await fetch("https://api.github.com/repos/chiin/feeeed/dispatches", {
                    method: "POST",
                    headers: {
                        "Accept": "application/vnd.github+json",
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        event_type: "anki_session",
                        client_payload: {
                            stream: deckId,
                            event_type: "anki_session",
                            results: sessionResults
                        }
                    })
                });

                if (res.ok) {
                    btn.innerText = "Saved to GitHub ✓";
                    btn.style.backgroundColor = "#30d158";
                    btn.style.color = "#000";
                    status.innerText = "State updated! Changes will appear after the next build.";
                } else if (res.status === 401) {
                    alert("Invalid PAT token. Clearing saved token.");
                    localStorage.removeItem("feeeed_pat");
                    status.innerText = "Invalid PAT. Please try again.";
                    btn.disabled = false;
                    btn.innerText = "Re-enter PAT & Sync";
                } else {
                    status.innerText = `Error saving (${res.status}).`;
                    btn.disabled = false;
                    btn.innerText = "Retry Sync";
                }
            } catch (err) {
                status.innerText = "Network error. Check your connection.";
                btn.disabled = false;
                btn.innerText = "Retry Sync";
            }
        }
    </script>
</body>
</html>
