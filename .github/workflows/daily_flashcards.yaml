name: Daily Flashcard Generator

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install feedgen

      - name: Run Flashcard Generator
        run: |
          python generate_cards.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml history.json flashcard_config.json cards/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Generate daily flashcard streams and HTML cards" && git push)
