name: Daily Flashcard Generator

on:
  schedule:
    - cron: '0 * * * *'  # Poll hourly; Python releases each stream once per HKT day
  workflow_dispatch:
  repository_dispatch:
    types: [advance_chapter, flashcard_grade, anki_review, pdf_batch_event, pdf_completed]
  push:                   # <-- ADD THIS: Triggers an auto-build anytime you push changes
    branches:
      - main
    paths:
      - 'config.json'
      - 'generate_feeds.py'
      - 'anki_scheduler.py'
      - 'reviewer.html'
      - 'reviewer_app.js'
      - 'reviewer_state.js'
      - 'pdf_scheduler.py'
      - 'pdf_reader.html'
      - 'pdf_reader_app.js'
      - '*.csv'

concurrency:
  group: flashcard-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update to latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install feedgen fsrs==6.3.2
      
      - name: Run Feed Engine
        run: |
          python generate_feeds.py
      
      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml history.json config.json cards/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily feeds and histories" && git push)
