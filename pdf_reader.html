<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Queue Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #1c1c1e;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            min-height: 58px;
            padding: 10px 14px;
            border-bottom: 1px solid #3a3a3c;
            background: #2c2c2e;
        }
        .title {
            max-width: 58vw;
            overflow: hidden;
            font-size: .95rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .progress {
            display: inline-block;
            margin-top: 4px;
            padding: 3px 8px;
            border-radius: 8px;
            background: #3a3a3c;
            color: #0a84ff;
            font-size: .75rem;
            font-weight: 700;
        }
        .btn {
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            background: #30d158;
            color: #000;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary { background: #0a84ff; color: #fff; }
        .pdf-container {
            width: 100%;
            max-width: 800px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 10px;
        }
        canvas {
            width: 100% !important;
            height: auto !important;
            margin-bottom: 12px;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .5);
        }
        .screen {
            display: none;
            max-width: 480px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }
        .screen.active { display: block; }
        .muted { color: #8e8e93; }
        .error { color: #ff453a; }
        .rendering { padding: 20px; text-align: center; }
        #syncStatus {
            min-height: 20px;
            margin: 8px 14px;
            font-size: .8rem;
            text-align: center;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .85);
        }
        .modal-content {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 12px;
            background: #2c2c2e;
        }
        .modal input {
            width: 100%;
            margin: 12px 0;
            padding: 10px;
            border: 1px solid #3a3a3c;
            border-radius: 6px;
            background: #1c1c1e;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="mainUI" style="display:none;">
        <div class="header">
            <div>
                <div id="docTitle" class="title">Loading...</div>
                <span id="batchProgress" class="progress">0 remaining</span>
            </div>
            <button id="finishBtn" class="btn" onclick="finishCurrentPDF()">Finished</button>
        </div>
        <p id="syncStatus" class="muted"></p>
        <div id="pdfViewer" class="pdf-container"></div>
    </div>

    <div id="statusScreen" class="screen active">
        <h2>PDF Queue</h2>
        <p id="statusMsg" class="muted">Loading PDF queue...</p>
        <button id="continueBtn" class="btn btn-primary" style="display:none;" onclick="requestContinuation()">Continue with another batch</button>
        <p id="statusSyncStatus" class="muted"></p>
    </div>

    <div id="patModal" class="modal">
        <div class="modal-content">
            <h3>GitHub Token Required</h3>
            <p class="muted">Enter your GitHub Personal Access Token to sync reading progress.</p>
            <input type="password" id="patInput" autocomplete="off" placeholder="GitHub token">
            <button class="btn btn-primary" onclick="savePATFromModal()">Save Token</button>
        </div>
    </div>

    <script src="reviewer_state.js"></script>
    <script src="pdf_reader_app.js"></script>
</body>
</html>
